<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DING WiFi - Connect</title>
    <link rel="stylesheet" href="index.css" type="text/css" />
</head>
<body class="portal">
    <div class="portal-container">
        <div class="glass-card">
            <div class="logo-section">
                <img class="logo" src="ding-logo.jpg" alt="DING Technologies">
            </div>
            
            <div class="welcome-section">
                <h1 class="welcome-title">Welcome to DING WiFi</h1>
                <p class="welcome-subtitle">Making Technology Work for You</p>
            </div>

            <div class="oper-section">
                <span id="oper-hint"></span>
                
                <div id="hotspot-section" style="display: none;">
                    <select id="hotspot-selector" class="oper-section-item"></select>
                </div>
                
                <form id="login-form">
                    <div id="input-voucher">
                        <input id="voucherCode" class="oper-section-item input" name="voucherCode" type="text" placeholder="Enter your voucher code"/>
                    </div>
                    <div id="input-user" style="display: none;">
                        <input id="username" class="oper-section-item input" name="username" type="text" placeholder="Username"/>
                    </div>
                    <div id="input-password" class="user-input" style="display: none;">
                        <input id="password" class="oper-section-item input" name="password" type="password" placeholder="Password"/>
                    </div>
                    <div id="input-simple" style="display: none;">
                        <input id="simplePassword" class="password oper-section-item" name="simplePassword" type="password" placeholder="Password"/>
                    </div>
                    <div id="input-phone-num" style="display: none;">
                        <span class="add">+</span><input id="country-code" class="input"><input id="phone-number" class="input" name="phone-number" type="text" placeholder="Phone Number"/>
                    </div>
                    <div id="input-verify-code" style="display: none;">
                        <input id="verify-code" class="input" name="verify-code" type="text" placeholder="Verification Code"/><button id="get-code" class="button-secondary">Get Code</button>
                    </div>
                    
                    <!-- Hidden fields for OMADA -->
                    <input name="clientMac" id="cMac" type="hidden">
                    <input name="radiusSvrIp" id="radiusServerIp" type="hidden">
                    
                    <button id="submit-btn" class="button-primary oper-section-item" type="submit">Connect</button>
                </form>
                
                <div class="divider">
                    <span>or</span>
                </div>
                
                <button id="buy-voucher-btn" class="button-buy oper-section-item" type="button" onclick="redirectToBuyVoucher()">
                    Buy Voucher with EcoCash
                </button>
            </div>
            
            <div class="footer-section">
                <p>Powered by DING Technologies</p>
            </div>
        </div>
    </div>
    
    <!-- Form Auth Modal -->
    <div id="form-auth-msg" class="modal-overlay">
        <div id="form-auth-outer" class="modal-content">
            <button id="form-auth-close" class="modal-close" type="button">&times;</button>
            <div id="form-auth-inner" class="modal-inner">
                <div id="form-auth-header" class="modal-header">
                    <div id="form-auth-title" class="modal-title"></div>
                    <div id="form-auth-note" class="modal-note"></div>
                </div>
                <div id="form-auth-content" class="modal-body"></div>
                <div id="form-auth-footer" class="modal-footer">
                    <a id="form-auth-submit" href="javascript:void(0);" class="button-primary">Submit</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="jquery.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
