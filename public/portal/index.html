<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-control" content="public">
    <title>DING WiFi - Connect</title>
    <link rel="stylesheet" href="index.css" type="text/css" />
</head>
<body class="portal">
    <div class="portal-container">
        <div class="glass-card">
            <div class="logo-section">
                <img class="logo" src="ding-logo.jpg" alt="DING Technologies">
            </div>
            
            <div class="welcome-section">
                <h1 class="welcome-title">Welcome to DING WiFi</h1>
                <p class="welcome-subtitle">Making Technology Work for You</p>
            </div>

            <div class="oper-section">
                <div id="oper-hint" class="oper-hint"></div>
                <div id="error-tips" class="error-tips"></div>
                
                <div id="hotspot-section" style="display: none;">
                    <select id="hotspot-selector" class="oper-section-item"></select>
                </div>
                
                <form id="login-form">
                    <div id="input-voucher" style="display: none;">
                        <input id="voucherCode" class="oper-section-item input" name="voucherCode" type="text" placeholder="Enter your voucher code"/>
                    </div>
                    <div id="input-user" style="display: none;">
                        <input id="username" class="oper-section-item input" name="username" type="text" placeholder="Username"/>
                    </div>
                    <div id="input-password" class="user-input" style="display: none;">
                        <input id="password" class="oper-section-item input" name="password" type="password" placeholder="Password"/>
                    </div>
                    <div id="input-simple" style="display: none;">
                        <input id="simplePassword" class="oper-section-item input" name="simplePassword" type="password" placeholder="Password"/>
                    </div>
                    <div id="input-phone-num" style="display: none;">
                        <span class="add">+</span><input id="country-code" class="input country-code-input"><input id="phone-number" class="input phone-input" name="phone-number" type="text" placeholder="Phone Number"/>
                    </div>
                    <div id="input-verify-code" style="display: none;">
                        <input id="verify-code" class="input verify-input" name="verify-code" type="text" placeholder="Verification Code"/><button id="get-code" class="button-secondary" type="button">Get Code</button>
                    </div>
                    
                    <!-- Hidden fields for OMADA - REQUIRED -->
                    <input name="clientMac" id="cMac" style="display:none">
                    <input name="radiusSvrIp" id="radiusServerIp" style="display:none">
                    
                    <!-- CRITICAL: type="button" not type="submit" -->
                    <button id="submit-btn" class="button-primary oper-section-item" type="button">Connect</button>
                </form>
                
                <div class="divider">
                    <span>or</span>
                </div>
                
                <button id="buy-voucher-btn" class="button-buy oper-section-item" type="button">
                    Buy Voucher with EcoCash
                </button>
            </div>
            
            <div class="footer-section">
                <p>Powered by DING Technologies</p>
            </div>
        </div>
    </div>
    
    <script src="jquery.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
